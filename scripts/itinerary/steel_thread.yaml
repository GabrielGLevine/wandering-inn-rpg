# The steel thread, as an itinerary (#434 M3/M3.5/M3.6).
#
# Hand-derived from the shipped 2569-step `qa/scripts/steel_thread.json`, which
# stays the golden this recompiles against (`scripts/itinerary/goldens.py`).
# INCOMPLETE and deliberately so: it is authored act by act, and it stops at
# the first beat the frozen vocabulary cannot express rather than hiding that
# beat inside `raw`.
#
# Covers shipped steps 0-217 -- the creation prelude and the whole of Act I,
# through the gate-road ambush and the arrival in Liscor. The 2026-08-13 M3.6
# amendment is what carried it past the M3.5 seam at step 62: the Relc spar is
# `fight: {entry: dialogue}`, the road ambush carries its tutor `beats:` and
# its post-dismiss banks, and every dialogue confirm now claims the events its
# own effects fire.
#
# THE SEAM IS NOW SHIPPED STEP 218, the start of Act II. What remains between
# this file and a green end-to-end golden is not language: it is the emitter
# IDIOM VARIANCE the differ measures against these 218 rows and the 2351
# behind them (`wandering_inn_game/qa/STEEL-THREAD.md` carries the table).

- act: i
  # §8's creation prelude, keyed by scalars. `tap_back` is the pointer-path
  # round trip (Esc back to PICK, re-commit the same card by tap) that the
  # keyboard route never exercises; `difficulty` names the rank the prompt is
  # expected to OPEN on, because #346 made both setup prompts open on the live
  # setting rather than on a fixed row.
  creation:
    race: drake
    gender: f
    name: Sella
    difficulty: Silver Rank
    hints: true
    tap_back: true
    shots:
      gate: 00_title_gate
      menu: 00_title_menu
      picker: 01_creation_00_picker_grid_drake_f_selected
      name: 01_creation_01_name_step_begin_control
      difficulty: 01_creation_02_creation_difficulty
      hints: 02_creation_hints
      world: 01_creation_char_creation_drake_f_inn
  nodes:
    # -- the inn sign, and the door that proves it stayed reachable ----------
    - id: act1.road.out
      goto: {map: floodplains}
    - id: act1.inn_sign
      interact:
        prop: inn_sign
        at: floodplains
        expect_accomplishment: read_the_inn_sign
    - id: act1.inn_sign.shot
      shot: {name: 02_tutorial_00b_inn_sign}
    - id: act1.inn.reentry
      goto: {map: inn, via: floodplains_inn_door_west}
      why: >-
        GH#375's can-fail reachability pin as a route: from the freed (6,6) the
        step north blocks on the west inn door and turns to face it, and the
        interact has to actually enter. A prop dropped on the approach cell
        would red here rather than in a playtest. `via` is what names WHICH
        door -- the main door (7,5) is equally oracle-valid and proves nothing
        about the west one.
    - id: act1.road.back
      goto: {map: floodplains}

    # -- Relc, and the spar the conversation itself starts -------------------
    - id: act1.spar
      why: >-
        Take the spar. It is the run's only classless fight and the only place
        the combat tutor's teaching beats fire in order, which is why the turn
        list is hand-driven rather than autoplayed -- an autoplayed spar would
        prove nothing about the beats it exists to fire.
      fight:
        encounter: relc_spar
        at: floodplains
        # M3.6 amendment item 1: the board opens on `spar_offer`'s own confirm,
        # off `{"start_combat": "relc_spar"}`. There is no approach to walk and
        # no second press -- compiling this as `interact` would walk to the
        # dummies and press again, which is a different entry.
        entry: dialogue
        npc: relc
        choose_path:
          - Just a traveler. Staying at the inn, heading for Liscor.
          - You any good with that spear? (Spar)
          - Ready when you are.
        mode: driven
        max_turns: 200
        turns:
          - {logged: ui_hotbar_rendered, where: {slots: 3}}
          - {beat: opening}
          - {await: turn_started, where: {id: pc}}
          - {settle: 5}
          - {pin: {path: combat.active, equals: pc}}
          - {pin: {path: combat.combatants.pc.cell, equals: [2, 3]}}
          - {press: move_right}
          - {await: combatant_moved, where: {id: pc, cell: [3, 3]}}
          - {beat: first_step}
          - {press: move_right}
          - {await: combatant_moved, where: {id: pc, cell: [4, 3]}}
          - {press: move_right}
          - {await: combatant_moved, where: {id: pc, cell: [5, 3]}}
          - {beat: pool_empty}
          - {pin: {path: combat.combatants.pc.move_pool, equals: 0}}
          - {press: hotbar_2}
          - {press: confirm}
          - {await: dashed, where: {id: pc, move_pool: 3}}
          - {beat: dash}
          - {press: move_right}
          - {await: combatant_moved, where: {id: pc, cell: [6, 3]}}
          - {press: hotbar_1}
          - {await: ui_targeting_shown}
          - {beat: aim}
          - {press: cycle}
          - {press: confirm}
          - {await: attack_resolved, where: {attacker: pc}}
          - {beat: first_blood}
          - {press: end_turn}
          - {await: turn_ended, where: {id: pc}}
          - {beat: watch}
          - {autoplay: true}
          - {beat: wrap}
    - id: act1.spar.no_gift
      assert: {event_absent: {type: item_gained}}
      why: Accepting the spar granted no item -- the gift moved off the accept row.

    # -- the first night: [Warrior] ------------------------------------------
    - id: act1.upstairs.seam
      goto: {map: inn_upstairs, cell: [2, 1]}
    - id: act1.upstairs.seam.shot
      shot: {name: 02_tutorial_00c_upstairs_floor_seam}
    - id: act1.bed.approach
      goto: {map: inn_upstairs, cell: [9, 1]}
    - id: act1.sleep.warrior
      # expect_veil_lines is DONOR-BACKED: the corpus pins 5 (the [Warrior
      # Class Obtained!] line + the level-1 kit's four [Skill – X Obtained!]
      # lines); the compiler does not derive veil lines (story lines fire off
      # sleep-time counters the ledger does not model).
      sleep: {expect_levels: true, expect_veil_lines: 5, shot: 02_tutorial_01_warrior_gained}

    # -- Relc's spear, and wearing it ----------------------------------------
    - id: act1.stairs.approach
      goto: {map: inn_upstairs, cell: [1, 1]}
      why: >-
        Stage the stair head. `stairs_down` (1,2) can be bumped from (1,1)
        going down or from (2,2) going left, and the router takes the second;
        the corpus takes the first. Both are oracle-valid and they leave the
        run facing different ways, so the approach cell is named rather than
        left to the shortest path.
    - id: act1.inn.waypoint
      goto: {map: inn, cell: [2, 3]}
      why: The corpus pins (2,3) at the foot of the stairs before the walk to the door.
    - id: act1.gift
      talk:
        npc: relc
        at: floodplains
        choose_path:
          - You said you had something for me?
          - I'll try it on. (Check your pack after this.)
        # The corpus photographs the gift line INSIDE the conversation, on the
        # node the first anchor opens, before the closing row (#434 residue).
        shots:
          You said you had something for me?: 02_tutorial_02_gift_teaching
      why: >-
        The spear is the run's whole martial line -- [Warrior] evolves to
        [Spearmaster] on spear-skill dominance, and this is the only spear the
        thread ever holds.
    - id: act1.equip.spear
      # ...and the worn spear with the inventory still OPEN.
      equip: {item: relcs_spare_spear, shot: 02_tutorial_03_spear_equipped}

    # -- the gate road, and the ambush that owns it --------------------------
    - id: act1.road.approach
      goto: {map: floodplains, cell: [30, 20]}
      why: >-
        Stage the approach. The band springs on a step into its Chebyshev-2
        radius, and WHICH step that is decides where the PC stands when the
        board opens -- the router's own shortest path enters the radius from
        the west at (28,23). This node puts the run one cell north of the
        radius, so the trigger step is the shipped one.
    - id: act1.ambush
      why: >-
        The Act I climax. Walked into, not interacted with: the raiding band
        springs on the step that lands inside its Chebyshev-2 radius, so the
        route stops one cell short and the fight IS the next move.
      fight:
        encounter: goblin_encounter_1
        at: floodplains
        entry: proximity
        max_turns: 300
        shots: [02_tutorial_04_ambush_warrior_spear]
        # M3.6 amendment item 3: the road ambush is a plain autoplay fight that
        # nonetheless carries two tutor beats -- one before the PC's first turn
        # and one after the board finishes -- and banks `sign_defended` between
        # the banner dismiss and the teardown, because `resolve_combat()` runs
        # on that confirm.
        beats: {before_turn: [real_ones], after_combat: [road_clear]}
        expect_banks_after_dismiss: true
    - id: act1.street.arrival
      goto: {map: street}
    - id: act1.street.shot
      shot: {name: 02_tutorial_05_street_arrival}
    - id: act1.gate_district.shot
      shot: {name: 03_liscor_gate_district_arrival}

# ---------------------------------------------------------------------------
# Act II -- Make a Place. Shipped steps 218-558. Authored 2026-09-06 against
# the corpus with the golden differ as the oracle; first slice covers 218-330
# (Pisces' lessons, the crate errand, Erin's package, the [Mage] sleep, the
# Guild interior).
- act: ii
  nodes:
    - id: act2.pisces.lessons
      talk:
        npc: pisces
        at: street
        open_shot: 04_act_ii_00_pisces_lessons
        choose_path:
          - "You're a mage. Teach me to cast."
          - How is casting different from swinging a blade?
          - So what do I cast first?
          - I'm ready. Show me the words.
          - Thank you, Pisces.
      why: >-
        The second class comes from Pisces' words, not a scroll: the lessons
        bank learned_magic_from_pisces, and the next sleep mints [Mage].
    - id: act2.krshia.ask
      talk:
        npc: krshia
        at: street
        choose_path:
          - I'll look into it.
          - I'll find it.
      why: Start the crate errand on its plain rung; the resolution comes later.
    - id: act2.home.floodplains
      goto: {map: floodplains}
    - id: act2.home.inn
      goto: {map: inn}
    - id: act2.erin.package
      talk:
        npc: erin
        at: inn
        choose_path:
          - I'll take the package.
          - On my way.
      why: The errand is Act II's spine; the package is what Selys is waiting for.
    - id: act2.bed.approach
      goto: {map: inn_upstairs, cell: [9, 1]}
    - id: act2.sleep.mage
      sleep: {expect_levels: true, shot: 04_act_ii_01_mage_gained}
    - id: act2.stairs.approach
      goto: {map: inn_upstairs, cell: [1, 1]}
      why: Same stair-head staging as Act I -- the corpus bumps the stairs from (1,1) going down.
    - id: act2.out.inn
      goto: {map: inn}
    - id: act2.out.floodplains
      goto: {map: floodplains}
    - id: act2.out.street
      goto: {map: street}
    - id: act2.guild.enter
      goto: {map: guild}
    - id: act2.guild.shot
      shot: {name: 04_act_ii_02_guild_interior}

    # Slice 331-439: the errand lands, Olesm names the cisterns, the crate
    # comes back by force, and the supplier's crew learns manners.
    - id: act2.selys.delivery
      talk:
        npc: selys
        at: guild
        choose_path:
          - Package for you, from Erin.
          - I'll keep it. Courier's fee.
          - (Leave.)
      why: >-
        The_errand completes on the hand-over; keeping the courier's fee banks
        kept_reward, the corpus's chosen rung.
    - id: act2.guild.out
      goto: {map: street}
    - id: act2.olesm.approach
      goto: {map: street, cell: [29, 4]}
      why: The corpus meets Olesm from below (29,4), not from the west of his desk.
    - id: act2.olesm.cisterns
      talk:
        npc: olesm
        at: street
        choose_path:
          - You look worried about something.
          - I'll look into it. Where do I start?
          - On it.
      why: Olesm starts the cisterns quest and banks heard_about_cisterns.
    - id: act2.south_square.approach
      goto: {map: street, cell: [11, 16]}
    - id: act2.fight.crate_scavengers
      fight:
        encounter: crate_scavengers
        at: street
        entry: interact
        policy: competent
        expect: victory
        shots:
          approach: [04_act_ii_03_south_square_scavengers]
          turn: [04_act_ii_04_crate_fight_mage_kit]
        expect_banks_after_dismiss: true
      why: The crate is recovered by force -- missing_crate beat 1 and recovered_crate_force.
    - id: act2.krshia.report
      talk:
        npc: krshia
        at: street
        choose_path:
          - Your crate's accounted for.
          - Glad to help.
      why: Closes missing_crate (beat 2) on the report rung.
    - id: act2.fight.supplier_scavengers
      fight:
        encounter: supplier_scavengers
        at: street
        entry: interact
        policy: competent
        expect: victory
        expect_banks_after_dismiss: true
      why: The side fight banks strongarmed_the_supplier.
    - id: act2.night2.floodplains
      goto: {map: floodplains}
    - id: act2.night2.inn
      goto: {map: inn}
    - id: act2.bed2.approach
      goto: {map: inn_upstairs, cell: [9, 1]}
    - id: act2.sleep.day3
      sleep: {}
      why: >-
        The corpus sleeps once between the supplier fight and the sewers and
        pins nothing on it; the compiler claims what the ledger knows.
    - id: act2.stairs2.approach
      goto: {map: inn_upstairs, cell: [1, 1]}
    - id: act2.day3.inn
      goto: {map: inn}
    - id: act2.day3.floodplains
      goto: {map: floodplains}
    - id: act2.day3.street
      goto: {map: street}
    - id: act2.day3.waypoint
      goto: {map: street, cell: [13, 3]}
      why: The corpus pins (13,3) on the way to the grate.
    - id: act2.sewers.enter
      goto: {map: sewers}
    - id: act2.sewers.shot
      shot: {name: 04_act_ii_05_sewers_descent}
    - id: act2.fight.shield_spiders
      fight:
        encounter: shield_spiders
        at: sewers
        entry: interact
        policy: competent
        expect: victory
        shots: [04_act_ii_06_cistern_nest_fight]
        expect_banks_after_dismiss: true
      why: The nest clears -- cisterns beat 1 and cleared_the_nest.
    - id: act2.sewers.out
      goto: {map: street}
    - id: act2.olesm.approach2
      goto: {map: street, cell: [29, 4]}
    - id: act2.olesm.report
      talk:
        npc: olesm
        at: street
        choose_path:
          - Any word on the cisterns?
          - It's dealt with. I cleared the nest myself.
          - Anytime, Olesm.
      why: cisterns_reported closes the quest (beat 2).
    - id: act2.night3.floodplains
      goto: {map: floodplains}
    - id: act2.night3.inn
      goto: {map: inn}
    - id: act2.bed3.approach
      goto: {map: inn_upstairs, cell: [9, 1]}
    - id: act2.sleep.tremor
      sleep: {}
      why: Two classes and three quests done -- the tremor pointer fires and something_beneath starts.
