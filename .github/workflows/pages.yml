# GitHub Pages: the page at the game's former address,
# https://gabrielglevine.github.io/wandering-inn-rpg/. The game's permanent
# web home is Firebase Hosting (https://wandering-inn-rpg.web.app), deployed by
# release.yml and hosting.yml.
#
# This workflow publishes the tracked, self-contained directory
# web/pages-redirect/ exactly as it is: no game build, no build step, no
# secrets. Browser saves are per origin, so this origin is where pre-move
# saves live; Pages must stay up indefinitely as the place they can be
# migrated from. Changing what the old address serves means editing
# web/pages-redirect/, not this file.
#
# Artifact flow only — never a gh-pages branch. Trigger: workflow_dispatch
# only. A release tag no longer touches Pages.

name: Publish GitHub Pages (former address)

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Publish web/pages-redirect
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Guard — the page exists
        run: test -s web/pages-redirect/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/pages-redirect

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
