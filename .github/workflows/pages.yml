# GitHub Pages: the page at the game's former address,
# https://gabrielglevine.github.io/wandering-inn-rpg/. The game's permanent
# web home is Firebase Hosting (https://wandering-inn-rpg.web.app), deployed by
# release.yml and hosting.yml.
#
# This workflow publishes the tracked, self-contained directory
# web/pages-redirect/ exactly as it is: no game build, no build step, no
# secrets. It refuses to run until that directory holds the save-migration
# page (sentinel comment) and the dispatcher types the confirm phrase. Browser saves are per origin, so this origin is where pre-move
# saves live; Pages must stay up indefinitely as the place they can be
# migrated from. Changing what the old address serves means editing
# web/pages-redirect/, not this file.
#
# Artifact flow only — never a gh-pages branch. Trigger: workflow_dispatch
# only. A release tag no longer touches Pages.

name: Publish GitHub Pages (former address)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Replaces the game at the old address. Type: publish-save-migration-page"
        type: string
        required: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Publish web/pages-redirect
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Publishing takes the old game offline at the origin where pre-move
      # saves live, so only the save-migration page may go out: it alone
      # carries the sentinel. The placeholder page does not.
      - name: Guard — confirmed, and the save-migration page is in place
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          if [ "$CONFIRM" != "publish-save-migration-page" ]; then
            echo "::error::confirm must be exactly 'publish-save-migration-page'."
            exit 1
          fi
          if ! grep -qF '<!-- wi-save-migration-page v1 -->' web/pages-redirect/index.html; then
            echo "::error::web/pages-redirect/index.html is not the save-migration page (sentinel '<!-- wi-save-migration-page v1 -->' missing). Publishing now would strand players' saves on this origin. Merge the migration PR first."
            exit 1
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/pages-redirect

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
