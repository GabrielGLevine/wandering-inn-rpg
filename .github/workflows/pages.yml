# GitHub Pages redirect. The game's web home moved to Firebase Hosting
# (https://wandering-inn-rpg.web.app, deployed by hosting.yml). Pages now
# serves ONE static page that forwards the old address
# https://gabrielglevine.github.io/wandering-inn-rpg/ so existing links keep
# working. No game build, no secrets.
#
# Artifact flow only — never a gh-pages branch. Trigger: workflow_dispatch
# only; run it once after the Firebase site is live. A release tag no longer
# touches Pages.

name: Publish GitHub Pages redirect

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Publish redirect page
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # 404.html makes every old deep link (e.g. /index.html) redirect too.
      - name: Stage the redirect site
        run: |
          set -euo pipefail
          mkdir -p _site
          cp .github/pages-redirect/index.html _site/index.html
          cp .github/pages-redirect/index.html _site/404.html
          grep -q 'https://wandering-inn-rpg.web.app/' _site/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
