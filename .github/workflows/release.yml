# Release — tag-driven itch.io wasm deploy for the Wandering Inn RPG
# (M-RELEASE Task R3).
#
# Fires ONLY on a version tag push (v*). Unlike ci.yml (which is secret-free and
# fork-PR-safe), THIS workflow is the ONLY place repo secrets are used:
#   - PRIVATE_ASSETS_TOKEN : a PAT with read access to the private assets repo,
#                            used to download the real (non-redistributable)
#                            asset bundle that overlays the fallback art.
#   - BUTLER_API_KEY        : itch.io butler credential for the wasm push.
# Tag pushes are user-only by tag protection (a USER ACTION — see the task
# report), so secrets are never reachable from a fork PR.
#
# Pipeline (spec §4): checkout → fetch private bundle → overlay assets → full QA
# gate re-run WITH real assets → wasm export (pinned 4.7 templates) → butler push.
# Implemented as ONE sequential job: every stage after the overlay needs the
# overlaid working tree, so splitting into separate GitHub jobs would mean
# shuttling the whole tree + build as artifacts for no benefit. Each stage below
# is a clearly delimited step group (a)–(d) mirroring the plan.
#
# ┌───────────────────────────────────────────────────────────────────────┐
# │ ⚠️  PLACEHOLDERS TO FILL BEFORE FIRST TAG (see task-r3-report.md):     │
# │   GODOT_SHA256 / GODOT_TEMPLATES_SHA256  →  real sha256 (as in ci.yml) │
# │   BUTLER_VERSION       →  an exact broth version (do NOT float LATEST) │
# └───────────────────────────────────────────────────────────────────────┘

name: Release

on:
  push:
    tags:
      - "v*"

# Read-only for the workflow's own GITHUB_TOKEN. The private-repo fetch uses the
# separate PRIVATE_ASSETS_TOKEN PAT, not this token; the itch push uses
# BUTLER_API_KEY. Nothing here needs write scope on THIS repo.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Pinned engine — copied verbatim from ci.yml so the two workflows can never
  # drift onto different 4.7 builds. Integrity via the official release
  # SHA512-SUMS.txt at run time (same mechanism as ci.yml).
  GODOT_VERSION: "4.7-stable"
  GODOT_BIN: "Godot_v4.7-stable_linux.x86_64"
  GODOT_URL: "https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_linux.x86_64.zip"
  GODOT_SUMS_URL: "https://github.com/godotengine/godot/releases/download/4.7-stable/SHA512-SUMS.txt"
  GODOT_TEMPLATES_URL: "https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_export_templates.tpz"
  # Butler pinned to an exact broth version — do NOT float LATEST (engine/tool
  # drift has bitten this project before; same discipline as the Godot pin).
  BUTLER_VERSION: "15.27.0"

jobs:
  release:
    name: Build + deploy tagged release
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Set up pinned Godot 4.7
        run: |
          set -euo pipefail
          curl -fsSL -o godot.zip "$GODOT_URL"
          curl -fsSL -o SHA512-SUMS.txt "$GODOT_SUMS_URL"
          grep "  ${GODOT_BIN}.zip$" SHA512-SUMS.txt | sed "s#  ${GODOT_BIN}.zip#  godot.zip#" | sha512sum -c -
          unzip -q godot.zip
          sudo install -m 0755 "$GODOT_BIN" /usr/local/bin/godot
          godot --version

      - name: Install pinned web export templates
        run: |
          set -euo pipefail
          curl -fsSL -o templates.tpz "$GODOT_TEMPLATES_URL"
          curl -fsSL -o SHA512-SUMS.txt "$GODOT_SUMS_URL"
          grep "  Godot_v4.7-stable_export_templates.tpz$" SHA512-SUMS.txt | sed "s#  Godot_v4.7-stable_export_templates.tpz#  templates.tpz#" | sha512sum -c -
          unzip -q templates.tpz
          dest="$HOME/.local/share/godot/export_templates/4.7.stable"
          mkdir -p "$dest"
          mv templates/* "$dest/"

      # ---------------------------------------------------------------- (a) bundle
      - name: (a) Fetch private asset bundle
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_ASSETS_TOKEN }}
          # Downloads the LATEST release's tarball — parked potential-assets-vN
          # releases in the assets repo must stay PRERELEASE or they shadow the bundle.
          PRIVATE_ASSETS_REPO: "GabrielGLevine/wandering-inn-rpg-assets"
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::PRIVATE_ASSETS_TOKEN secret is not set. A tagged release MUST build with the real (non-redistributable) assets — the fallback-art path is the contributor/CI experience, not a shippable demo. Add the secret in repo Settings → Secrets and variables → Actions, then re-push the tag."
            exit 1
          fi
          if [ "$PRIVATE_ASSETS_REPO" = "OWNER/PRIVATE-REPO" ]; then
            echo "::error::PRIVATE_ASSETS_REPO is still the placeholder 'OWNER/PRIVATE-REPO'. Edit .github/workflows/release.yml and set it to the real private assets repo before tagging."
            exit 1
          fi
          mkdir -p bundle
          # Grab the latest release's bundle tarball from the private repo.
          gh release download --repo "$PRIVATE_ASSETS_REPO" \
            --pattern '*.tar.gz' --dir bundle
          count=$(ls -1 bundle/*.tar.gz 2>/dev/null | wc -l | tr -d ' ')
          if [ "$count" -eq 0 ]; then
            echo "::error::No *.tar.gz asset bundle found in the latest release of $PRIVATE_ASSETS_REPO. Build one with scripts/make_asset_bundle.sh and attach it to a release there."
            exit 1
          fi
          echo "Downloaded $count bundle tarball(s):"
          ls -la bundle/

      - name: (a) Overlay real assets onto the working tree
        run: |
          set -euo pipefail
          tarball="$(ls -1 bundle/*.tar.gz | head -n1)"
          echo "Overlaying: $tarball"
          # The bundle preserves the wandering_inn_game/assets/** layout
          # relative to the repo root (see scripts/make_asset_bundle.sh), so a
          # plain extract at the root drops each file into place over the
          # committed fallback tree.
          tar -xzf "$tarball" -C .
          # Sanity: the overlay must have landed at least one real asset file.
          if [ -z "$(find wandering_inn_game/assets -type f 2>/dev/null | head -n1)" ]; then
            echo "::error::assets/ is empty after overlay — the bundle did not extract into wandering_inn_game/assets/. Check make_asset_bundle.sh's layout."
            exit 1
          fi
          echo "Overlay complete."

      # ------------------------------------------------------------------ (b) gate
      # Full QA gate re-run WITH the real assets — mirrors ci.yml's smoke + unit +
      # sweep jobs (release must be green with real art too, spec §4). Grep
      # discipline + alarm wraps identical to ci.yml.
      - name: (b) Import pass
        run: |
          set -euo pipefail
          perl -e 'alarm 300; exec @ARGV' \
            godot --headless --path wandering_inn_game --import

      - name: (b) Headless smoke (--quit)
        run: |
          set -euo pipefail
          log=smoke.log
          perl -e 'alarm 120; exec @ARGV' \
            godot --headless --path wandering_inn_game --quit >"$log" 2>&1 || rc=$?
          cat "$log"
          if grep -nE 'SCRIPT ERROR|Parse Error|WARNING' "$log"; then
            echo "::error::smoke boot produced a SCRIPT ERROR / Parse Error / WARNING"
            exit 1
          fi
          exit "${rc:-0}"

      - name: (b) Unit test suites (tests/test_*.gd)
        run: |
          set -uo pipefail
          cd wandering_inn_game
          fail=0
          for t in tests/test_*.gd; do
            name="$(basename "$t")"
            log="/tmp/unit_${name}.log"
            echo "==> $name"
            perl -e 'alarm 240; exec @ARGV' \
              godot --headless --path . --script "res://$t" >"$log" 2>&1 || fail=1
            cat "$log"
            if grep -nE 'SCRIPT ERROR|Parse Error|WARNING' "$log"; then
              echo "::error::$name tripped the error/warning grep"; fail=1
            fi
            if ! grep -q '^PASS' "$log"; then
              echo "::error::$name did not print a PASS line"; fail=1
            fi
          done
          exit $fail

      - name: (b) Balance harness (sim_combat_batch)
        run: |
          set -uo pipefail
          cd wandering_inn_game
          log="/tmp/sim_combat_batch.log"
          perl -e 'alarm 600; exec @ARGV' \
            godot --headless --path . --script res://tests/sim_combat_batch.gd >"$log" 2>&1 || rc=$?
          cat "$log"
          if grep -nE 'SCRIPT ERROR|Parse Error|WARNING' "$log"; then
            echo "::error::sim_combat_batch tripped the error/warning grep"; exit 1
          fi
          exit "${rc:-0}"

      - name: (b) Full canonical sweep (qa/ci_sweep.sh)
        # GH#287: same 4-way parallel opt-in as ci.yml's sweep jobs.
        env:
          WI_SWEEP_JOBS: 4
        run: |
          set -euo pipefail
          bash wandering_inn_game/qa/ci_sweep.sh

      # ------------------------------------------------------------------ (c) wasm
      - name: (c) Guard — Web export preset must exist
        run: |
          set -euo pipefail
          cfg=wandering_inn_game/export_presets.cfg
          if [ ! -f "$cfg" ] || ! grep -q 'name="Web"' "$cfg"; then
            echo "::error::export_presets.cfg is missing a \"Web\" preset."
            exit 1
          fi

      - name: (c) Export wasm build (reuses the existing web export path)
        run: |
          set -euo pipefail
          # qa/web/export_web.sh is the project's canonical web export command
          # (godot --headless --export-release "Web" build/web/index.html). It
          # writes to wandering_inn_game/build/web/.
          perl -e 'alarm 600; exec @ARGV' \
            bash wandering_inn_game/qa/web/export_web.sh
          if [ ! -f wandering_inn_game/build/web/index.html ]; then
            echo "::error::wasm export did not produce build/web/index.html"
            exit 1
          fi
          ls -la wandering_inn_game/build/web

      # ---------------------------------------------------------------- (d) butler
      - name: (d) Install pinned butler (itch.io broth)
        run: |
          set -euo pipefail
          if [ "$BUTLER_VERSION" = "PIN-ME-butler-version" ]; then
            echo "::error::BUTLER_VERSION is still the placeholder. Pin an exact broth version (e.g. 15.21.0) in release.yml before tagging."
            exit 1
          fi
          curl -fsSL -o butler.zip \
            "https://broth.itch.zone/butler/linux-amd64/${BUTLER_VERSION}/archive/default"
          unzip -q butler.zip -d butler-bin
          chmod +x butler-bin/butler
          ./butler-bin/butler -V

      - name: (d) Push wasm build to itch.io
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          # ⚠️ PLACEHOLDER — replace with the real itch project (user/game).
          ITCH_TARGET: "sibianthegreybird/the-wandering-inn-rpg"
        run: |
          set -euo pipefail
          if [ -z "${BUTLER_API_KEY:-}" ]; then
            echo "::error::BUTLER_API_KEY secret is not set — cannot push to itch.io. Add it in repo Settings → Secrets and variables → Actions."
            exit 1
          fi
          if [ "$ITCH_TARGET" = "ITCH_USER/ITCH_GAME" ]; then
            echo "::error::ITCH_TARGET is still the placeholder 'ITCH_USER/ITCH_GAME'. Edit release.yml and set it to the real itch project before tagging."
            exit 1
          fi
          # butler push is atomic per channel; re-runnable from the same tag.
          ./butler-bin/butler push wandering_inn_game/build/web \
            "${ITCH_TARGET}:html5" --userversion "${GITHUB_REF_NAME}"

  # ------------------------------------------------------------------------
  # desktop-exports — issue #19 (Steam seed, M-STEAM item 1/4). Tag-triggered
  # like `release` above, but its own job: builds Win+Linux native artifacts
  # and uploads them as WORKFLOW artifacts (no store push here — SteamPipe
  # upload is the separate, gated job below). Deliberately does NOT fetch the
  # private asset bundle: this proves the export pipeline on the committed
  # placeholder-art fallback tree, same as every non-tag CI run builds on.
  # macOS is a local-only proof for this pass (notarization is explicitly
  # deferred per the M-STEAM seed spec §3) — no macOS CI export job yet.
  desktop-exports:
    name: Desktop exports (Windows + Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up pinned Godot 4.7
        run: |
          set -euo pipefail
          curl -fsSL -o godot.zip "$GODOT_URL"
          curl -fsSL -o SHA512-SUMS.txt "$GODOT_SUMS_URL"
          grep "  ${GODOT_BIN}.zip$" SHA512-SUMS.txt | sed "s#  ${GODOT_BIN}.zip#  godot.zip#" | sha512sum -c -
          unzip -q godot.zip
          sudo install -m 0755 "$GODOT_BIN" /usr/local/bin/godot
          godot --version

      - name: Install pinned export templates (bundle covers every platform)
        run: |
          set -euo pipefail
          # The official templates .tpz is platform-independent — it contains
          # the windows/linux/macos/web/android/ios template binaries in one
          # archive (same file release.yml's web job already downloads for
          # its wasm export), so no separate desktop-specific URL is needed.
          curl -fsSL -o templates.tpz "$GODOT_TEMPLATES_URL"
          curl -fsSL -o SHA512-SUMS.txt "$GODOT_SUMS_URL"
          grep "  Godot_v4.7-stable_export_templates.tpz$" SHA512-SUMS.txt | sed "s#  Godot_v4.7-stable_export_templates.tpz#  templates.tpz#" | sha512sum -c -
          unzip -q templates.tpz
          dest="$HOME/.local/share/godot/export_templates/4.7.stable"
          mkdir -p "$dest"
          mv templates/* "$dest/"

      - name: Import pass
        run: |
          set -euo pipefail
          perl -e 'alarm 300; exec @ARGV' \
            godot --headless --path wandering_inn_game --import

      - name: Guard — desktop export presets must exist
        run: |
          set -euo pipefail
          cfg=wandering_inn_game/export_presets.cfg
          if [ ! -f "$cfg" ] || ! grep -q 'name="windows_desktop"' "$cfg" || ! grep -q 'name="linux_x86_64"' "$cfg"; then
            echo "::error::export_presets.cfg is missing the windows_desktop/linux_x86_64 presets."
            exit 1
          fi

      - name: Export Windows desktop build
        run: |
          set -euo pipefail
          mkdir -p wandering_inn_game/build/windows
          perl -e 'alarm 600; exec @ARGV' \
            godot --headless --path wandering_inn_game \
            --export-release "windows_desktop" build/windows/WanderingInnRPG.exe
          if [ ! -f wandering_inn_game/build/windows/WanderingInnRPG.exe ]; then
            echo "::error::Windows export did not produce WanderingInnRPG.exe"
            exit 1
          fi
          ls -la wandering_inn_game/build/windows

      - name: Export Linux x86_64 build
        run: |
          set -euo pipefail
          mkdir -p wandering_inn_game/build/linux
          perl -e 'alarm 600; exec @ARGV' \
            godot --headless --path wandering_inn_game \
            --export-release "linux_x86_64" build/linux/WanderingInnRPG.x86_64
          if [ ! -f wandering_inn_game/build/linux/WanderingInnRPG.x86_64 ]; then
            echo "::error::Linux export did not produce WanderingInnRPG.x86_64"
            exit 1
          fi
          chmod +x wandering_inn_game/build/linux/WanderingInnRPG.x86_64
          ls -la wandering_inn_game/build/linux

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-desktop-${{ github.ref_name }}
          path: wandering_inn_game/build/windows/
          retention-days: 14
          if-no-files-found: error

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64-${{ github.ref_name }}
          path: wandering_inn_game/build/linux/
          retention-days: 14
          if-no-files-found: error

  # ------------------------------------------------------------------------
  # steampipe-upload — SKELETON (issue #19). Stays green-but-inert until the
  # user provisions Steam credentials (docs/steam/CHECKLIST.md): the `if:`
  # gate below short-circuits the whole job to "skipped" while
  # vars.STEAM_APP_ID is unset, so this workflow never regresses CI green
  # just by existing. Follows the SAME secrets idiom as the butler push
  # above (a build-account credential secret + a target-channel value), NOT
  # a new convention — see wi-shipping skill. Uploads ONLY to a
  # private/unlisted Steam branch (vars.STEAM_BRANCH, refused if it resolves
  # to "default") — this is a pipeline proof, never a public release path,
  # and per issue #20's binding ruling the game ships FREE with zero
  # payment plumbing, so nothing here touches pricing/purchase config.
  steampipe-upload:
    name: SteamPipe upload (private branch) [SKELETON]
    needs: desktop-exports
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: vars.STEAM_APP_ID != ''
    steps:
      - uses: actions/checkout@v4

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-desktop-${{ github.ref_name }}
          path: steam_build/windows

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: linux-x86_64-${{ github.ref_name }}
          path: steam_build/linux

      - name: Install steamcmd
        run: |
          set -euo pipefail
          mkdir -p steamcmd
          curl -fsSL -o steamcmd.tar.gz https://steamcdn-a.akamaihd.net/client/installer/steamcmd_linux.tar.gz
          tar -xzf steamcmd.tar.gz -C steamcmd
          chmod +x steamcmd/steamcmd.sh
          # First run bootstraps/self-updates the tool; a bare +quit is the
          # standard no-op invocation for that.
          ./steamcmd/steamcmd.sh +quit || true

      - name: Write Steam build-account login config
        env:
          STEAM_CONFIG_VDF: ${{ secrets.STEAM_CONFIG_VDF }}
        run: |
          set -euo pipefail
          if [ -z "${STEAM_CONFIG_VDF:-}" ]; then
            echo "::error::STEAM_CONFIG_VDF secret is not set — cannot log in to steamcmd non-interactively. This is a base64-encoded config.vdf from a ONE-TIME interactive 'steamcmd +login <user>' on a trusted machine (captures the Steam Guard-authorized session so CI never sees a 2FA prompt). Provision per docs/steam/CHECKLIST.md."
            exit 1
          fi
          mkdir -p steamcmd/config
          echo "$STEAM_CONFIG_VDF" | base64 -d > steamcmd/config/config.vdf

      - name: Write SteamPipe app_build/depot_build configs
        env:
          STEAM_APP_ID: ${{ vars.STEAM_APP_ID }}
          STEAM_BRANCH: ${{ vars.STEAM_BRANCH }}
          STEAM_DEPOT_ID_WINDOWS: ${{ vars.STEAM_DEPOT_ID_WINDOWS }}
          STEAM_DEPOT_ID_LINUX: ${{ vars.STEAM_DEPOT_ID_LINUX }}
        run: |
          set -euo pipefail
          branch="${STEAM_BRANCH:-unlisted-ci}"
          if [ "$branch" = "default" ]; then
            echo "::error::STEAM_BRANCH resolved to 'default' — a CI SteamPipe upload must target a private/unlisted branch, never the public depot. Set the STEAM_BRANCH repo variable to something like 'unlisted-ci'."
            exit 1
          fi
          if [ -z "${STEAM_DEPOT_ID_WINDOWS:-}" ] || [ -z "${STEAM_DEPOT_ID_LINUX:-}" ]; then
            echo "::error::STEAM_DEPOT_ID_WINDOWS / STEAM_DEPOT_ID_LINUX repo variables are not set. Depot IDs are assigned per-app in the Steamworks partner site (App Admin > SteamPipe > Depots) — they are NOT derived from the app id. Provision per docs/steam/CHECKLIST.md."
            exit 1
          fi
          mkdir -p steam_scripts
          # Heredoc bodies are indented to stay inside this YAML block scalar
          # (a de-dented line would terminate it early) — Valve's KeyValues
          # format ignores leading whitespace, so this is cosmetic-only.
          cat > steam_scripts/depot_windows.vdf <<EOF
          "DepotBuildConfig"
          {
            "DepotID" "${STEAM_DEPOT_ID_WINDOWS}"
            "ContentRoot" "$(pwd)/steam_build/windows"
            "FileMapping"
            {
              "LocalPath" "*"
              "DepotPath" "."
              "recursive" "1"
            }
          }
          EOF
          cat > steam_scripts/depot_linux.vdf <<EOF
          "DepotBuildConfig"
          {
            "DepotID" "${STEAM_DEPOT_ID_LINUX}"
            "ContentRoot" "$(pwd)/steam_build/linux"
            "FileMapping"
            {
              "LocalPath" "*"
              "DepotPath" "."
              "recursive" "1"
            }
          }
          EOF
          cat > steam_scripts/app_build.vdf <<EOF
          "AppBuild"
          {
            "AppID" "${STEAM_APP_ID}"
            "Desc" "CI build ${GITHUB_REF_NAME}"
            "Preview" "0"
            "Local" ""
            "SetLive" "${branch}"
            "Depots"
            {
              "${STEAM_DEPOT_ID_WINDOWS}" "steam_scripts/depot_windows.vdf"
              "${STEAM_DEPOT_ID_LINUX}" "steam_scripts/depot_linux.vdf"
            }
          }
          EOF

      - name: SteamPipe upload (private/unlisted branch only)
        env:
          STEAM_BUILD_ACCOUNT: ${{ secrets.STEAM_BUILD_ACCOUNT }}
        run: |
          set -euo pipefail
          if [ -z "${STEAM_BUILD_ACCOUNT:-}" ]; then
            echo "::error::STEAM_BUILD_ACCOUNT secret is not set. Provision per docs/steam/CHECKLIST.md."
            exit 1
          fi
          ./steamcmd/steamcmd.sh +login "$STEAM_BUILD_ACCOUNT" \
            +run_app_build "$(pwd)/steam_scripts/app_build.vdf" +quit
