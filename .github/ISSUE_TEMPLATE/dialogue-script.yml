name: Dialogue script
description: Write a conversation — an NPC exchange, branching choices, or a new scene of dialogue.
title: "[Dialogue] "
labels: ["community-dialogue"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for writing dialogue! Before you fill this in:

        - **Voice and canon come from the [Wandering Inn Wiki](https://thewanderinginn.fandom.com/) and the books.** Match how the character actually talks; link the wiki page. Don't invent backstory — flag anything that isn't book canon.
        - **Choices should do something.** The best submissions gate options on what the player has done or knows, and lead somewhere (a quest, a [Skill] check, a relationship beat) — not just flavor.
        - **Three pillars.** Dialogue is the backbone of the **Social** pillar, but the strongest scenes also open **Combat** or **Puzzle/Exploration** doors (a persuade that avoids a fight, a clue that unlocks a route).
        - **Demo-sized wins.** One focused scene beats a sprawling branching tree.
        - **How review works:** a maintainer applies the `triage` label to run an automated Opus draft-pass. It drafts or asks for missing info as a comment — a human decides everything; no lore is auto-approved.
  - type: input
    id: one-liner
    attributes:
      label: One-line pitch
      description: The scene in a sentence — who's talking and what it's about.
      placeholder: The player asks <NPC> about <topic>, and can <branch>.
    validations:
      required: true
  - type: dropdown
    id: scope
    attributes:
      label: Scope guess
      description: Demo-sized lands fastest.
      options:
        - Demo-sized — one conversation, a handful of nodes
        - Small — a conversation with a few gated branches / a loop-back hub
        - Large — a multi-scene dialogue arc (expect it to be sliced down)
        - Not sure
    validations:
      required: true
  - type: textarea
    id: canon-refs
    attributes:
      label: Canon references (wiki links)
      description: >-
        Link the wiki page for every speaking character and any [Skill], place, or event the dialogue references.
        Flag anything you've invented rather than sourced from the books.
      placeholder: |
        - Selys Shivertail: https://thewanderinginn.fandom.com/wiki/Selys_Shivertail
    validations:
      required: false
  - type: textarea
    id: description
    attributes:
      label: The dialogue
      description: >-
        Write it out. Include the branching — player options, what gates each option (a prior accomplishment, a known [Skill], an item), and where each choice leads. Note any effect a choice should have (start a quest, begin combat, grant an item).
      placeholder: |
        NPC opening line: ...
        > Option 1 (always shown): ... -> leads to ...
        > Option 2 (only if the player has done X): ... -> effect: ...
        > Option 3 (leaves): ...
    validations:
      required: true
  - type: checkboxes
    id: conventions
    attributes:
      label: House rules
      description: Two conventions that bind every piece of content in this game.
      options:
        - label: My dialogue never states or implies a raw stat number (STR/DEX/CON/etc.). Race, class, level, [Skills], HP/MP, and gear are fine; numeric attributes are never surfaced.
          required: true
        - label: My dialogue doesn't tell the player how close they are to a class/level/skill. Advancement is opaque until it happens at the sleep beat.
          required: true
